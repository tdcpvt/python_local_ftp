<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Windows XP Professional</title>
    <style>
        {% include 'includes/style.css' %}
    </style>
</head>
<body data-used-mb="{{ used_mb }}">

    <div class="desktop-icons">
    {% if role == 'admin' %}
    <div class="icon desktop-shortcut" onclick="openWindow('adminWindow')" style="top: 20px; left: 20px;">
        <div class="icon-img">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#d48800"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/></svg>
        </div>
        <div>Admin Tools</div>
    </div>
    
    <div class="icon desktop-shortcut" onclick="openNetworkConfigManager()" style="top: 110px; left: 20px;">
        <div class="icon-img">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#1b5e20"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </div>
        <div>Network Tools</div>
    </div>
    {% endif %}

    <!-- Express Notes Desktop Icon Shortcut -->
    <div class="icon desktop-shortcut" onclick="toggleNotesWindow()" style="top: {% if role == 'admin' %}200px{% else %}20px{% endif %}; left: 20px;">
        <div class="icon-img" style="font-size: 24px; line-height: 28px;">📫</div>
        <div>Express Notes</div>
    </div>
    
    {% for client in clients %}
    <div class="icon desktop-shortcut" onclick="openExplorer('{{ client }}')" style="top: {{ (loop.index0 * 90) + (290 if role == 'admin' else 110) }}px; left: 20px;">
        <div class="icon-img">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#0054e3"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
        </div>
        <div>{{ client }}'s PC</div>
    </div>
    {% endfor %}
    </div>

    <!-- Main Window Blocks Inclusion -->
    {% include 'includes/windows.html' %}

    <!-- NEW MODULAR INCLUSION FOR THE START INTERFACE -->
    {% include 'includes/start_menu.html' %}

    <!-- NEW MODULAR INCLUSION FOR THE MESSAGE BOX -->
    {% include 'includes/notes_window.html' %}

    <!-- Core Explorer Functions Script -->
    <script>
        {% include 'includes/scripts.js' %}
    </script>

    <!-- NEW ISOLATED START COMPONENT TRIGGER SCRIPT -->
    <script>
        {% include 'includes/start_trigger.js' %}
    </script>

    <!-- DRAG AND DROP ENGINE EXTERNAL SCRIPT -->
    <script src="{{ url_for('static', filename='desktop_drag.js') }}"></script>
</body>
</html>
